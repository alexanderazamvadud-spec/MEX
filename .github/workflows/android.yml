name: Android APK

# Builds the MEX Android app (APK-01) with Capacitor and publishes MEX.apk.
# Separate from deploy.yml, which publishes the website to GitHub Pages.
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

# Needed to create and update the GitHub releases that carry MEX.apk.
permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      # Every build gets a unique, increasing versionCode; versionName follows a v* tag.
      MEX_VERSION_CODE: ${{ github.run_number }}
      MEX_VERSION_NAME: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '0.1.0' }}
      HAS_DEBUG_KEY: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 != '' }}
      HAS_RELEASE_KEY: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - name: Check out the code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Capacitor 8 needs JDK 21.
      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build the web app for Android
        run: npm run build:android

      - name: Copy the web app into the Android project
        run: npx cap sync android

      - name: Make the Gradle wrapper executable
        run: chmod +x android/gradlew

      # One fixed debug key (secret), so every APK has the same signature and installs
      # as an update without wiping the learner's progress.
      - name: Restore the debug signing key
        if: env.HAS_DEBUG_KEY == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/mex-debug.p12"
          echo "MEX_DEBUG_KEYSTORE=$RUNNER_TEMP/mex-debug.p12" >> "$GITHUB_ENV"

      - name: Build the debug APK
        env:
          MEX_DEBUG_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_DEBUG_KEYSTORE_PASSWORD }}
        run: cd android && ./gradlew assembleDebug --stacktrace

      - name: Name the APK MEX.apk
        run: cp android/app/build/outputs/apk/debug/*.apk MEX.apk

      # Android Gradle Plugin leaves out the v1 (JAR) signature when minSdk is 24 or higher,
      # and some manufacturers' installers (e.g. MagicOS) refuse such APKs. Re-sign the finished,
      # already zip-aligned APK with the same fixed debug key and all three schemes.
      - name: Sign MEX.apk with the v1, v2 and v3 schemes
        if: env.HAS_DEBUG_KEY == 'true'
        env:
          MEX_DEBUG_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_DEBUG_KEYSTORE_PASSWORD }}
        run: |
          BUILD_TOOLS="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)"
          "$BUILD_TOOLS/apksigner" sign             --ks "$MEX_DEBUG_KEYSTORE" --ks-type PKCS12 --ks-key-alias mexdebug             --ks-pass env:MEX_DEBUG_KEYSTORE_PASSWORD --key-pass env:MEX_DEBUG_KEYSTORE_PASSWORD             --v1-signing-enabled true --v2-signing-enabled true --v3-signing-enabled true             --out MEX-signed.apk MEX.apk
          mv MEX-signed.apk MEX.apk

      # Never publish an APK that a phone would refuse: check alignment, every signature
      # scheme and the package flags with the Android build tools, and fail the run otherwise.
      - name: Verify the APK (alignment, signatures, package)
        run: |
          set -o pipefail
          BUILD_TOOLS="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)"
          echo "Build tools: $BUILD_TOOLS"
          if ! "$BUILD_TOOLS/zipalign" -c -v 4 MEX.apk > zipalign.txt; then tail -n 20 zipalign.txt; echo "::error::MEX.apk is not zip-aligned."; exit 1; fi
          tail -n 1 zipalign.txt
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs MEX.apk | tee apksigner.txt
          for scheme in v1 v2 v3; do
            if ! grep -qE "^Verified using $scheme scheme .*: true$" apksigner.txt; then
              echo "::error::MEX.apk is not signed with the $scheme scheme; some phones would refuse to install it."
              exit 1
            fi
          done
          "$BUILD_TOOLS/aapt2" dump badging MEX.apk > badging.txt
          grep -E "^package:|SdkVersion|testOnly|application-debuggable|^uses-permission" badging.txt || true
          if grep -q "testOnly" badging.txt; then echo "::error::MEX.apk is marked test-only and would not install from a download."; exit 1; fi

      - name: Upload the APK as a build artifact
        uses: actions/upload-artifact@v7
        with:
          name: MEX-debug-apk
          path: MEX.apk

      # Rolling release: the same tag and file name every time, so
      # https://github.com/alexanderazamvadud-spec/MEX/releases/latest/download/MEX.apk never changes.
      - name: Publish MEX.apk to the latest-build release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: latest-build
          name: MEX latest build
          body: |
            Latest Android build of MEX from the main branch (debug build, versionCode ${{ github.run_number }}).
            Commit: ${{ github.sha }}

            Install: open https://github.com/alexanderazamvadud-spec/MEX/releases/latest/download/MEX.apk on an Android phone, download it, open the file and allow "Install unknown apps" for your browser when asked.
          files: MEX.apk
          overwrite_files: true
          prerelease: false
          make_latest: 'true'

      - name: Publish a versioned release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: MEX ${{ github.ref_name }}
          files: MEX.apk
          make_latest: 'false'

      # Optional signed release build: runs only when all release-key secrets exist.
      - name: Restore the release signing key
        if: env.HAS_RELEASE_KEY == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/mex-release.jks"
          echo "MEX_RELEASE_KEYSTORE=$RUNNER_TEMP/mex-release.jks" >> "$GITHUB_ENV"

      - name: Build the signed release APK
        if: env.HAS_RELEASE_KEY == 'true'
        env:
          MEX_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          MEX_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          MEX_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: cd android && ./gradlew assembleRelease --stacktrace

      - name: Upload the signed release APK
        if: env.HAS_RELEASE_KEY == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: MEX-release-apk
          path: android/app/build/outputs/apk/release/*.apk
